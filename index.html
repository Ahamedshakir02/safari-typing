<!doctype html>
<html lang="en" dir="ltr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />

    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/x-icon" href="/favicon.ico" sizes="any" />
    <meta name="theme-color" content="#f1eadd" />

    <!-- The first-load splash is prerendered into the HTML so it is there from
         the first paint (see Layout.jsx). It is dismissed by JS, so without JS
         it would sit over the page forever — hide it in that case. -->
    <noscript>
      <style>
        .site-loader { display: none !important; }
      </style>
    </noscript>

    <!-- Per-route <head> — title, description, canonical, Open Graph, Twitter
         cards and JSON-LD — is rendered by src/components/Seo.jsx through
         vite-react-ssg's <Head> and prerendered into each route's static HTML. -->

    <!-- Fonts: EB Garamond (display serif) + Figtree (body) are self-hosted via
         @fontsource (imported in src/main.jsx) — no render-blocking Google Fonts. -->

    <!-- Analytics (privacy-friendly, cookieless). NOTE: the Plausible property for
         safaritypingservices.com must be created in the Plausible dashboard for
         data to record. Swap for GA4 here if preferred. -->
    <script defer data-domain="safaritypingservices.com" src="https://plausible.io/js/script.js"></script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
